<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimetradersFx - Premium Consistency Rule Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{background:#050505;color:#fff;padding:24px;
background-image:radial-gradient(circle at top,#3b2d06 0,#0b0b0b 35%,#000 100%)}
.container{max-width:950px;margin:auto}
.header{display:flex;align-items:center;gap:20px;padding:28px;border:1px solid #6f5a08;border-radius:28px;
background:linear-gradient(180deg,#191919,#111);box-shadow:0 0 35px rgba(255,196,0,.08)}
.logo{width:70px;height:70px;border-radius:50%;border:4px solid #ffd54f;display:flex;align-items:center;justify-content:center;
font-size:42px;font-weight:900;color:#ffd54f;box-shadow:0 0 25px rgba(255,213,79,.4)}
h1{font-size:42px;color:#ffd54f}
.tag{letter-spacing:5px;color:#e4bf4a;margin-top:8px}
.main{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;margin-top:28px;border:1px solid #6f5a08;border-radius:28px;padding:20px;background:#111}
.panel{background:#151515;border:1px solid #4b3c07;border-radius:22px;padding:26px}
.title{font-size:30px;color:#ffd54f;margin-bottom:24px}
label{display:block;margin:18px 0 8px;color:#ffd54f;font-weight:700}
input{width:100%;padding:16px;border-radius:14px;border:1px solid #333;background:#1f1f1f;color:#fff;font-size:18px}
button{margin-top:25px;width:100%;padding:17px;border:none;border-radius:14px;background:linear-gradient(90deg,#a06d00,#ffd54f);font-size:20px;font-weight:800;cursor:pointer}
.info{margin-top:25px;background:linear-gradient(90deg,#2b2209,#171717);padding:20px;border-radius:18px;color:#f3d37a;line-height:1.9}
.row{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #2b2b2b;font-size:24px}
.val{color:#43ffb0;font-weight:800}
.status{margin-top:28px;padding:16px;border-radius:14px;text-align:center;font-size:24px;font-weight:900}
.pass{background:#123b1f;color:#8dffb7}
.fail{background:#4c1111;color:#ffb6b6}
footer{text-align:center;color:#aaa;padding:20px}
footer a{color:#ffd54f;text-decoration:none;margin:0 10px}
@media(max-width:900px){.main{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">TF</div>
<div><h1>TIMETRADERSFX</h1><div class="tag">PATIENCE &nbsp; | &nbsp; DISCIPLINE &nbsp; | &nbsp; CONSISTENCY</div></div>
</div>

<div class="main">
<div class="panel">
<div class="title">Premium Consistency Rule Calculator</div>
<label>Total Profit ($)</label>
<input id="target" type="number" placeholder="">
<label>Highest Single Day Profit ($)</label>
<input id="highest" type="number" placeholder="">
<label>Consistency Rule (%)</label>
<input id="rule" type="number" >
<button onclick="calc()">Calculate</button>
</div><div class="panel">
<div class="row"><span>Allowed Profit</span><span id="allowed" class="val">$0.00</span></div>
<div class="row"><span>Highest Day</span><span id="day" class="val">$0.00</span></div>
<div class="row"><span>Usage</span><span id="usage" class="val">0%</span></div>
<div class="row" style="border:none"><span>Rule</span><span id="ruletxt" class="val">40%</span></div>
<div id="status" class="status pass">Waiting for calculation</div>
</div>
</div>

<footer>
© 2026 TimetradersFx<br><br>
🌐 <a href="https://timetradersfx.in">timetradersfx.in</a> |
📸 <a href="https://instagram.com/timetraders_fx">@timetraders_fx</a> |
📢 <a href="https://t.me/timetraders_fx">Telegram</a>
</footer>
</div>

<script>
function calc(){
const t=parseFloat(document.getElementById('target').value)||0;
const h=parseFloat(document.getElementById('highest').value)||0;
const r=parseFloat(document.getElementById('rule').value)||0;
if(t<=0||r<=0){
 alert('Please enter valid values.');
 return;
}
const a=t*r/100;
const u=a>0?(h/a*100):0;
document.getElementById('allowed').textContent='$'+a.toFixed(2);
document.getElementById('day').textContent='$'+h.toFixed(2);
document.getElementById('usage').textContent=u.toFixed(1)+'%';
document.getElementById('ruletxt').textContent=r+'%';
const st=document.getElementById('status');
if(h<=a){
 st.className='status pass';
 st.textContent='✔ PASS - Consistency Rule Met';
}else{
 st.className='status fail';
 st.textContent='✖ FAIL - Consistency Rule Violated';
}
}
</script>

</body></html>
